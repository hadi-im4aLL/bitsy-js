<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitsyJS</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./main.js"></script>
</head>
<body>
    <r-container r-data>
        isDebugMode: {isDebugMode}
    </r-container>

    <r-container r-data="{ isDebugMode: false }">
        <r-container r-if="isDebugMode === true">
            1
        </r-container>

        <r-container r-if="isDebugMode === false">
            2
        </r-container>

        <hr>

        <p r-if="isDebugMode === true">
            1
        </p>

        <p r-if="isDebugMode === false">
            2
        </p>
    </r-container>

    <hr>

    <h2>Fragment load test</h2>

    <hr>

    <div id="test" r-data="{ name: 'Test App', version: '1.0.0', items: '[{ a: 1, b: 2 }, { c: 3, d: 4 }]', nested: '{ a: { b: 2 } }', isOpen: false }">
        <h3>{appName}</h3>

        <p>App name: {name}</p>
        <p>Version: {version}</p>
    </div>

    <hr>

    <ul>
        <li r-for="game of games">
            <h4>{game.name}</h4>
            <p>Rating: {game.rating}</p>
            <p>_index: {_index} | isFirst: {_isFirst} | isLast: {_isLast}</p>
        </li>
    </ul>

    <hr>

    <ul>
        <li r-for="provider of aiProviders">
            <r-view src="./views/loop.html">loop</r-view>
        </li>
    </ul>

    <hr>

    <r-view src="./views/header.html">header</r-view>
    <r-view src="./views/home.html">home</r-view>
    <r-view src="./views/footer.html">footer</r-view>

    <script type="module">
        import { bjs } from './main.js';

        bjs.ready(() => {
            console.log(`rendered`);
        });
    </script>
</body>
</html>
