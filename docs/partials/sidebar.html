<aside class="docs-sidebar" b-data>
    <details class="docs-browse" open>
        <summary class="docs-browse-summary">
            Browse the docs
            <i class="iconoir-nav-arrow-down docs-icon" aria-hidden="true"></i>
        </summary>

        <div class="docs-browse-body">
            <div class="docs-search">
                <i class="iconoir-search docs-icon" aria-hidden="true"></i>
                <input
                    type="search"
                    placeholder="Search the docs"
                    aria-label="Search the docs"
                    data-doc-search
                    autocomplete="off"
                    value="{query()}"
                    b-on:input="query.set($event.target.value)"
                />
                <kbd aria-hidden="true">/</kbd>
            </div>

            <nav aria-label="Documentation">
                <div class="docs-nav-group">
                    <p class="docs-nav-title" b-if="visibleItems('getting-started').length > 0">Getting started</p>
                    <ul class="docs-nav-list">
                        <li b-for="item of visibleItems('getting-started')">
                            <a class="docs-side-link" href="{item.href}" aria-current="{item.current ? 'page' : 'false'}"> {item.title} </a>
                        </li>
                    </ul>
                </div>

                <div class="docs-nav-group">
                    <p class="docs-nav-title" b-if="visibleItems('features').length > 0">Features</p>
                    <ul class="docs-nav-list">
                        <li b-for="item of visibleItems('features')">
                            <a class="docs-side-link" href="{item.href}" aria-current="{item.current ? 'page' : 'false'}"> {item.title} </a>
                        </li>
                    </ul>
                </div>

                <div class="docs-nav-group">
                    <p class="docs-nav-title" b-if="visibleItems('reference').length > 0">Reference</p>
                    <ul class="docs-nav-list">
                        <li b-for="item of visibleItems('reference')">
                            <a class="docs-side-link" href="{item.href}" aria-current="{item.current ? 'page' : 'false'}"> {item.title} </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <p class="docs-nav-empty" b-if="visibleCount() === 0">No pages match your search.</p>

            <div class="docs-side-meta">
                <p class="docs-side-version">
                    <span class="badge badge-primary">v{version}</span>
                    MIT license
                </p>
                <a href="https://github.com/im4aLL/bitsy-js">Source on GitHub</a>
                <a href="../index.html">Docs home</a>
            </div>
        </div>
    </details>
</aside>
