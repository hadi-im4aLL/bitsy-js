<main>
    <h1>{appName}</h1>

    <section r-data="{ heading: 'Products', featured: true }">
        <h2>{heading}</h2>

        <ul>
            <template r-for="product in products">
                <li>{ product.name }</li>
                <li>{ product.description }</li>
            </template>
        </ul>
    </section>

    <section>
        <r-view src="./partials/product.html" r-for="product in products" r-data="{ name: product.name, description: product.description }">Loading Product</r-view>
    </section>
</main>

<r-view src="./nested.html">Loading Nested</r-view>
